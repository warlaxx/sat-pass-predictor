name: Keep the API awake

# Render's free plan spins the backend down after 15 minutes without inbound traffic, and
# the first visitor after that waited 20 s for /api/passes and got a 502 after 120 s on
# /api/separations (audit of 3 October 2026, ABD-28). A request every few minutes keeps
# it up. The 750 free instance hours a month cover one service running all month (744 h
# at most), so this costs nothing as long as it is the workspace's only free service.
#
# Why /actuator/health/liveness and not /actuator/health: the full health check queries
# PostgreSQL, which would keep the database compute awake around the clock too. The
# liveness group only reports the application's own state. It goes through neither the
# quota interceptor (passes controllers only) nor the usage counters (explicit
# POST /api/usage/{event}), so the ping is never counted as a visit.
#
# Every 5 minutes, not 10: GitHub delays scheduled jobs, often by several minutes, and a
# 10-minute schedule plus a 6-minute delay lets the service fall asleep. GitHub also
# pauses schedules in a public repository after 60 days without a commit.
#
# Repository secret: BACKEND_URL, shared with daily-import.yml.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
    steps:
      # Retries cover a cold start, when a delayed run found the service already asleep.
      # The time of the first attempt is the one a visitor would have waited.
      - name: Ping the backend
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::BACKEND_URL is not set; nothing to ping."
            exit 0
          fi
          for i in $(seq 1 6); do
            result=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 60 \
              "$BACKEND_URL/actuator/health/liveness" || true)
            echo "Attempt $i: HTTP ${result% *} in ${result#* } s"
            [ "${result% *}" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::The backend did not answer /actuator/health/liveness."
          exit 1
