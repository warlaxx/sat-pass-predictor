name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push while a run is still going makes the first one pointless: its verdict
# would describe a commit nobody will look at again. Cancel it instead of paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # The suite runs in about a minute. Anything past this is a hang, and a hung job
    # burns six hours of runner time by default.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: satpass
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: satpass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satpass -d satpass_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/satpass_test
      TEST_DATABASE_USERNAME: satpass
      TEST_DATABASE_PASSWORD: test-only
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # orekit-data weighs about 100 MB and its content barely moves. The key carries the
      # ISO week, so the download happens once a week rather than on every run and a
      # stale cache can never be more than seven days old — far inside the tolerances of
      # the reference test, which propagates a frozen 2021 TLE.
      - name: Stamp the week
        id: stamp
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Orekit data
        uses: actions/cache@v4
        with:
          path: orekit-data
          key: orekit-data-${{ steps.stamp.outputs.week }}-${{ hashFiles('scripts/fetch-orekit-data.sh') }}

      # A no-op when the cache has restored the directory.
      - name: Fetch Orekit data
        run: ./scripts/fetch-orekit-data.sh

      # The wrapper, not the runner's Maven: the badge then attests exactly the command
      # the README gives.
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # setup-node@v4 ships npm 10.9.x with Node 22, whose arborist crashes on
      # vitest's peer dependency chain (npm/cli#8261).
      - name: Upgrade npm
        run: npm install -g npm@12

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # A build says the code compiles, not that it works. One test today, many from
      # milestone 6 on: running them costs nothing, discovering later that they were
      # never run costs a milestone.
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Verify account dashboard interactions
        run: node --test scripts/account-dashboard.test.mjs
