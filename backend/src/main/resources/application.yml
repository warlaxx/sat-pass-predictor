spring:
  application:
    name: sat-pass-predictor
  mvc:
    problemdetails:
      # Off by default in Spring Boot. Without it, a parameter the framework rejects
      # (missing, wrong type, out of bounds) comes back in a different format from the
      # errors ApiExceptionHandler produces, and carries no type a client could branch
      # on. Two error formats on one endpoint is not an API.
      enabled: true

orekit:
  # Candidate directories, searched in order: the first one that actually holds the data
  # wins. Two entries because there are two places this application gets launched from -
  # backend/ (Maven, the IDE) and the repository root. OREKIT_DATA_PATH replaces the list
  # with the single location it names, so an explicit setting is never second-guessed.
  data-paths: ${OREKIT_DATA_PATH:../orekit-data,orekit-data}

tle:
  # Sources tried in order, first usable answer wins. Both serve the same CelesTrak
  # catalogue; the second one exists because reachability is not a property of the
  # service alone. CelesTrak silently drops packets from the shared outbound IPs of
  # Render's Frankfurt and Oregon regions - a connect timeout, no refusal, no DNS error,
  # while the same host completes a handshake from another datacenter in 10 ms. The
  # second entry is a rewrite on the frontend's own Vercel host, whose egress is not
  # blacklisted, forwarding exactly one path (see frontend/vercel.json).
  #
  # The origin comes first on purpose: locally it answers immediately and nothing depends
  # on the frontend being deployed. On Render the first entry costs connect-timeout
  # before the second is tried - once per refresh at worst, never per request.
  #
  # TLE_BASE_URLS replaces the whole list, comma-separated, for an environment that wants
  # a different order or a single source.
  base-urls: ${TLE_BASE_URLS:https://celestrak.org,https://sat-pass-predictor-nine.vercel.app/tle-upstream}
  # Also the latency paid for each unreachable source before falling through to the next.
  connect-timeout: 2s
  # 10s, and the number is a measurement. 5s was set for a direct call to CelesTrak; the
  # relay is a second hop - Render to Vercel's edge, then Vercel to CelesTrak in the
  # United States - and answers in about a second warm and about five cold. Timed from a
  # browser against the deployed API: successful retrievals at 3.0 and 3.2 s, failures at
  # 7.1 and 7.1 s, which is 2s of connect timeout on the first source plus exactly 5s of
  # read timeout on the second. The 503 was our own budget, not the upstream refusing us.
  read-timeout: 10s
  # A source that just failed is tried LAST for this long, never removed. Measured on the
  # same run: the first endpoint burned its full connect timeout on every retrieval, having
  # never once answered from that host - two seconds taken out of the budget the relay then
  # had to answer within. See FallbackTleClient.
  source-cooldown: 10m
  # Past this age since the last fetch, the sources are called again.
  # This is not a validity period: see TleStore.
  refresh-after: 2h
  # Minimum delay between two attempts. Keeps an outage from turning every
  # incoming request into a round of calls to every source.
  retry-after: 5m
  # Past this age since the epoch of the elements, we refuse to predict.
  max-age: 7d
  maximum-size: 500

  # Last source of the chain, and optional: no credentials, no source, and the
  # application says so once at startup. Space-Track is the catalogue CelesTrak
  # republishes, so it is here for the day the others cannot be REACHED - not for objects
  # they do not have. That is why a "not found" still ends the chain before it gets here.
  #
  # Credentials come from the environment, never from this file. On Render they are
  # declared sync: false, which is how a Blueprint asks the human instead of git.
  #
  # The caps sit below Space-Track's published limits of 30/min and 300/h. Space-Track
  # enforces them by throttling and then by suspending the account, and an account
  # suspended is a source lost - the opposite of what a second source is for.
  space-track:
    base-url: https://www.space-track.org
    identity: ${SPACETRACK_IDENTITY:}
    password: ${SPACETRACK_PASSWORD:}
    requests-per-minute: 20
    requests-per-hour: 200

springdoc:
  # Swagger UI under a short address: it is the first page anyone opens on this
  # repository, it has no business being called /swagger-ui/index.html.
  swagger-ui:
    path: /docs
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
