# Render Blueprint. Render -> New -> Blueprint -> point it at this repository.
# The service must keep the name below: frontend/vercel.json rewrites /api/* to
# https://sat-pass-predictor-api.onrender.com, and Render derives that host from the name.
services:
  - type: web
    name: sat-pass-predictor-api
    runtime: docker
    repo: https://github.com/warlaxx/sat-pass-predictor
    branch: main
    dockerfilePath: ./backend/Dockerfile
    # The Dockerfile copies backend/ AND nothing else, but it is written against the
    # repository root so that scripts/ stays reachable if the build ever needs it.
    dockerContext: .
    plan: free
    # Lyon is the reference site of this project and CelesTrak is the only outbound
    # dependency: the closer region wins on both legs.
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # The frontend never calls this host directly - Vercel proxies /api server-side -
      # so no CORS configuration is needed on this side. Keep it that way.
      # preferIPv4Stack: the container resolves celestrak.org to an AAAA record it has
      # no route for, connect() hangs, and the 3 s timeout fires - the textbook shape of
      # "unreachable" on a PaaS. Forcing IPv4 removes that whole branch.
      # The two timeouts are raised for THIS machine only (0,1 vCPU: the application took
      # 84 s to boot). application.yml keeps 3 s / 5 s, which are right on a laptop.
      # Passed as -D rather than as environment variables: a system property carries the
      # property name verbatim, where TLE_CONNECT_TIMEOUT would bind to tle.connect.timeout
      # and be silently ignored.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Djava.net.preferIPv4Stack=true -Dtle.connect-timeout=10s -Dtle.read-timeout=20s
