# Render Blueprint. Render -> New -> Blueprint -> point it at this repository.
# The service must keep the name below: frontend/vercel.json rewrites /api/* to
# https://sat-pass-predictor-api.onrender.com, and Render derives that host from the name.
services:
  - type: web
    name: sat-pass-predictor-api
    runtime: docker
    repo: https://github.com/warlaxx/sat-pass-predictor
    branch: main
    dockerfilePath: ./backend/Dockerfile
    # The Dockerfile copies backend/ AND nothing else, but it is written against the
    # repository root so that scripts/ stays reachable if the build ever needs it.
    dockerContext: .
    plan: free
    # Oregon, not Frankfurt, and it is CelesTrak that decides. The Frankfurt instance
    # could not open a TCP connection to celestrak.org (104.168.149.178:443) at all -
    # HttpConnectTimeoutException, no refusal, no DNS failure: packets dropped. The host
    # is in the United States and answers other datacenters in 10 ms, so the block is on
    # that path. Lyon is only the default coordinate of a form; the round trip that
    # actually has to work is the one to CelesTrak.
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # The frontend never calls this host directly - Vercel proxies /api server-side -
      # so no CORS configuration is needed on this side. Keep it that way.
      # CelesTrak blacklists Render's shared outbound IPs - Frankfurt and Oregon both
      # time out at the TCP level, while another datacenter connects in 10 ms. The
      # frontend's own host is not blacklisted, so the call goes through a rewrite there
      # that forwards exactly one path. A workaround, named as one: the durable answer is
      # a second TLE source, and this comes out the day Space-Track lands.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Dtle.base-url=https://sat-pass-predictor-nine.vercel.app/tle-upstream
