# Render Blueprint. Render -> New -> Blueprint -> point it at this repository.
# The service must keep the name below: frontend/vercel.json rewrites /api/* to
# https://sat-pass-predictor-api.onrender.com, and Render derives that host from the name.
services:
  - type: web
    name: sat-pass-predictor-api
    runtime: docker
    repo: https://github.com/warlaxx/sat-pass-predictor
    branch: main
    dockerfilePath: ./backend/Dockerfile
    # The Dockerfile copies backend/ AND nothing else, but it is written against the
    # repository root so that scripts/ stays reachable if the build ever needs it.
    dockerContext: .
    plan: free
    # Frankfurt, and the region is no longer load-bearing. Frankfurt and Oregon both
    # failed to open a TCP connection to celestrak.org (104.168.149.178:443) -
    # HttpConnectTimeoutException, no refusal, no DNS failure: packets dropped, on a host
    # that answers other datacenters in 10 ms. Moving regions never fixed that and never
    # could; the TLE chain in application.yml did, by not depending on one egress path.
    # What the region decides now is the only thing it ever should have: the latency of
    # the Vercel <-> Render leg for European users.
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # The frontend never calls this host directly - Vercel proxies /api server-side -
      # so no CORS configuration is needed on this side. Keep it that way.
      #
      # No -Dtle.base-url override here any more. It used to carry the only working TLE
      # endpoint, which made a deployment setting load-bearing for the application to
      # work at all - and this file is only read when the service is created from a
      # Blueprint. A service created by hand in the dashboard ignores it silently, and
      # that is exactly how an instance ended up calling the blacklisted host while the
      # repository said otherwise. The source list lives in application.yml, ships in the
      # image, and is overridable by TLE_BASE_URLS when an environment really differs.
      # Prefer the relay on Render; the direct origin remains a fallback.
      - key: TLE_BASE_URLS
        value: https://sat-pass-predictor-nine.vercel.app/tle-upstream,https://celestrak.org
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
      # Space-Track, last source of the chain. sync: false means Render asks for the
      # value when the Blueprint is applied and keeps it out of this repository. Leave
      # both empty and the application starts without that source, and says so in its
      # startup log - it does not fail.
      - key: SPACETRACK_IDENTITY
        sync: false
      - key: SPACETRACK_PASSWORD
        sync: false
